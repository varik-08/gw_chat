version: "3.9"

services:
  kafka:
    image: bitnami/kafka:3.7
    container_name: kafka
    environment:
      - KAFKA_ENABLE_KRAFT=yes
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_KRAFT_CLUSTER_ID=abcdefghijklmnopqrstuv
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD", "bash", "-c", "/opt/bitnami/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list | cat"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - micro_net

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    environment:
      - KAFKA_CLUSTERS_0_NAME=local
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:9092
    ports:
      - "8081:8080"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - micro_net

  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      - POSTGRES_USER=app
      - POSTGRES_PASSWORD=app
      - POSTGRES_DB=app
    ports:
      - "5432:5432"
    volumes:
      - ./docker_data/db_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/10_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - micro_net

  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: jaeger
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686" # UI
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    networks:
      - micro_net

  auth:
    build:
      context: .
      dockerfile: Dockerfile-go
    container_name: auth
    environment:
      - APP_HTTP_HOST=0.0.0.0
      - APP_HTTP_PORT=8082
      - APP_DB_HOST=postgres
      - APP_DB_PORT=5432
      - APP_DB_USER=app
      - APP_DB_PASSWORD=app
      - APP_DB_DATABASE=app
      - APP_DB_SCHEMA=public
      - KAFKA_BROKERS=kafka:9092
      - OTEL_EXPORTER_OTLP_ENDPOINT=jaeger:4317
    command: ["/app/auth"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - micro_net

  user:
    build:
      context: .
      dockerfile: Dockerfile-go
    container_name: user
    environment:
      - APP_DB_HOST=postgres
      - APP_DB_PORT=5432
      - APP_DB_USER=app
      - APP_DB_PASSWORD=app
      - APP_DB_DATABASE=app
      - APP_DB_SCHEMA=public
      - KAFKA_BROKERS=kafka:9092
      - OTEL_EXPORTER_OTLP_ENDPOINT=jaeger:4317
    command: ["/app/user"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - micro_net

  chat:
    build:
      context: .
      dockerfile: Dockerfile-go
    container_name: chat
    environment:
      - APP_DB_HOST=postgres
      - APP_DB_PORT=5432
      - APP_DB_USER=app
      - APP_DB_PASSWORD=app
      - APP_DB_DATABASE=app
      - APP_DB_SCHEMA=public
      - KAFKA_BROKERS=kafka:9092
      - OTEL_EXPORTER_OTLP_ENDPOINT=jaeger:4317
    command: ["/app/chat"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - micro_net

  message:
    build:
      context: .
      dockerfile: Dockerfile-go
    container_name: message
    environment:
      - APP_DB_HOST=postgres
      - APP_DB_PORT=5432
      - APP_DB_USER=app
      - APP_DB_PASSWORD=app
      - APP_DB_DATABASE=app
      - APP_DB_SCHEMA=public
      - KAFKA_BROKERS=kafka:9092
      - OTEL_EXPORTER_OTLP_ENDPOINT=jaeger:4317
    command: ["/app/message"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - micro_net

  orchestrator:
    build:
      context: .
      dockerfile: Dockerfile-go
    container_name: orchestrator
    environment:
      - APP_DB_HOST=postgres
      - APP_DB_PORT=5432
      - APP_DB_USER=app
      - APP_DB_PASSWORD=app
      - APP_DB_DATABASE=app
      - APP_DB_SCHEMA=public
      - KAFKA_BROKERS=kafka:9092
      - OTEL_EXPORTER_OTLP_ENDPOINT=jaeger:4317
    command: ["/app/orchestrator"]
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - micro_net

  gateway:
    build:
      context: .
      dockerfile: Dockerfile-go
    container_name: gateway
    ports:
      - "8080:8080"
    environment:
      - AUTH_JWKS_URL=http://auth:8082/.well-known/jwks.json
      - KAFKA_BROKERS=kafka:9092
      - OTEL_EXPORTER_OTLP_ENDPOINT=jaeger:4317
    command: ["/app/gateway"]
    depends_on:
      auth:
        condition: service_started
      kafka:
        condition: service_healthy
    networks:
      - micro_net

networks:
  micro_net: {}

